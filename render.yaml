services:
  - type: web
    name: kravik-nettside-v3
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: node server.js
    # /health svarer 200 så lenge sida kan servere innhald (òg i degradert
    # modus). Synk-helsa overvakast eksternt via /health/synk (UptimeRobot e.l.)
    healthCheckPath: /health
    # Innhaldscommits frå admin (data/**) skal IKKJE utløyse ny deploy
    buildFilter:
      ignoredPaths:
        - data/**
        - docs/**
        - "*.md"
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        value: main
      # E-postvarsling for kontaktskjema OG driftsvarsel (synk-feil,
      # token-utløp). Utan desse kan meldingar gå tapt på gratisplanen.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Avsendaradresse – påkravd når SMTP_USER ikkje er ei e-postadresse
      # (t.d. Resend, der brukarnamnet er «resend»)
      - key: MAIL_FROM
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      # Ekte Google-omtalar på framsida (valfritt – sjå DRIFT.md)
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GOOGLE_PLACE_ID
        sync: false
